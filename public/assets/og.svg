<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A2E"/>
      <stop offset="1" stop-color="#16213E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo lockup (dark) -->
  <g transform="translate(80,72)">
    <path d="M6 30 L22 46 L52 12" fill="none" stroke="#FF6B35" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="44" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#F7F7FB">Fitcheck<tspan fill="#FF6B35">.</tspan></text>
  </g>

  <!-- giant translucent check motif, right -->
  <path d="M820 360 L905 445 L1085 215" fill="none" stroke="#FF6B35" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.16"/>

  <!-- headline -->
  <text x="80" y="300" font-size="74" font-weight="800" letter-spacing="-2" fill="#F7F7FB">Let every shopper</text>
  <text x="80" y="384" font-size="74" font-weight="800" letter-spacing="-2" fill="#F7F7FB">become your <tspan fill="#FF6B35">product model</tspan>.</text>

  <!-- subline -->
  <text x="80" y="470" font-size="30" font-weight="500" fill="#B9BCD0">AI virtual try-on for Shopify fashion brands — live in 48 hours.</text>

  <!-- pill -->
  <g transform="translate(80,520)">
    <rect width="300" height="56" rx="28" fill="#FF6B35"/>
    <text x="150" y="37" font-size="24" font-weight="700" fill="#1A1A2E" text-anchor="middle">Reserve your launch</text>
  </g>
</svg>
